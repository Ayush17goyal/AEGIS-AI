services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: sqlite:////data/aegis.db
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-AegisDemo!2026}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-local-demo-only}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-30}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16777216}
      NEMO_CONFIG_PATH: ${NEMO_CONFIG_PATH:-/app/guardrails}
      LAYA_MODEL_DIR: ${LAYA_MODEL_DIR:-}
      LEAK_GW_KEYS: ${LEAK_GW_KEYS:-}
      LEAK_GW_CURRENT_KID: ${LEAK_GW_CURRENT_KID:-k1}
      AEGIS_VAULT_KEY: ${AEGIS_VAULT_KEY:-}
    volumes:
      - aegis-data:/data
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  aegis-data:
